<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <!-- Favicon  Tag -->
    <link rel="icon" href="../favicon.webp" sizes="32x32"/>
    <title>EXERCÍCIO 04 -  Integrando os recursos em JAVASCRIPT</title>
    <meta name="description" content="...">

<body>
    <h1>Integrando os recursos de interatividade do JS</h1>
    <hr>
    <script>
        window.alert("Seja bem-vindo ao site");
        let nome = window.prompt("QUAL É O SEU NOME? ");
        window.alert(nome);
        console.log(nome);
        let resposta = window.confirm("Você deseja sair da página? ");
        console.log(resposta);
        document.write("SEJA BEM-VINDO " + nome);

        if(resposta==true){
            setTimeout(() => {                
                window.open("index.html");
            }, 3000); // 3000 milissegundos = 3 segundos

        }else{
            window.confirm(nome + ", você vai continuar nessa página!");
        }        

    </script>
</body>
<html>
